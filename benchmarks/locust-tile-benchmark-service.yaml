type: service
name: locust-tile-benchmark
image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/reyashv/slb-pov
    ref: ${COMMIT_HASH}
    branch_name: restructure/slb-pov
  build_spec:
    type: tfy-python-buildpack
    build_context_path: ./benchmarks/
    command: locust -f locust_tile_benchmark.py
    python_version: '3.11'
    python_dependencies:
      type: pip
      requirements_path: requirements.txt
ports:
  - host: locust-tile-benchmark-slb-ws-8089.slb-pilot.truefoundry.cloud
    port: 8089
    expose: true
    protocol: TCP
    app_protocol: http
env:
  # Switch model here — no redeploy needed, just change env var and restart
  # Options: sfm-large | sfm-large-trt | sfm-large-512
  MODEL: sfm-large-trt
workspace_fqn: ${WORKSPACE_FQN}
replicas: 1
resources:
  node:
    type: node_selector
    capacity_type: spot_fallback_on_demand
  cpu_request: 2
  cpu_limit: 4
  memory_request: 4000
  memory_limit: 8000
  ephemeral_storage_request: 5000
  ephemeral_storage_limit: 10000
allow_interception: false
