type: job
name: vjepa-joint-finetune
image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/reyashv/slb-pov
    ref: c7c0e8828a3dc895230f5d702f422ecdec042ecd
    branch_name: restructure/slb-pov
  build_spec:
    type: tfy-python-buildpack
    build_context_path: ./encoders/vjepa/
    command: python joint_finetune.py
    python_version: '3.11'
    python_dependencies:
      type: pip
      requirements_path: requirements.txt
trigger:
  type: manual
resources:
  node:
    type: node_selector
    capacity_type: spot_fallback_on_demand
  devices:
    - name: L4
      type: nvidia_gpu
      count: 1
  cpu_request: 2
  cpu_limit: 4
  memory_request: 13600
  memory_limit: 16000
  ephemeral_storage_request: 20000
  ephemeral_storage_limit: 100000
env:
  EPOCHS: '5'
  HEAD_LR: '0.001'
  EMBED_DIM: '1024'
  MODEL_DIR: ${ARTIFACT_VJEPA_VITL}
  ENCODER_LR: '0.00001'
  NUM_CLASSES: '10'
  OUTPUT_DECODER_NAME: decoder-classify-joint
  OUTPUT_ENCODER_NAME: vjepa2-vitl-finetuned
workspace_fqn: ${WORKSPACE_FQN}
retries: 0
