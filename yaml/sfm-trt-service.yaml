type: service
name: sfm-large-trt
image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/reyashv/slb-pov
    ref: ed5324fbe2c53f1ab2bfa9993f75c1e17399b9b1
    branch_name: restructure/slb-pov
  build_spec:
    type: dockerfile
    build_context_path: ./encoders/sfm/
    dockerfile_path: ./encoders/sfm/Dockerfile.trt
    command: python sfm_server_trt.py
ports:
  - host: sfm-large-trt-slb-ws-8000.slb-pilot.truefoundry.cloud
    port: 8000
    expose: true
    protocol: TCP
    app_protocol: http
env:
  TRT_ENGINE_FQN: ${TRT_ENGINE_FQN}
  SFM_IMG_SIZE: '224'
workspace_fqn: ${WORKSPACE_FQN}
replicas: 1
resources:
  node:
    type: node_selector
    capacity_type: spot_fallback_on_demand
  devices:
    - name: L40S
      type: nvidia_gpu
      count: 1
  cpu_request: 2
  cpu_limit: 4
  memory_request: 27200
  memory_limit: 48000
  ephemeral_storage_request: 20000
  ephemeral_storage_limit: 100000
readiness_probe:
  config:
    type: http
    path: /v2/health/ready
    port: 8000
  failure_threshold: 3
  initial_delay_seconds: 120
  period_seconds: 10
  success_threshold: 1
  timeout_seconds: 1
allow_interception: false
