type: service
name: vjepa2-vitl
image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/reyashv/slb-pov
    ref: 1201ee31f418373a871511b629f2584a63babcc1
    branch_name: main
  build_spec:
    type: tfy-python-buildpack
    build_context_path: ./vjepa_encoder/
    command: >-
      gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
      vjepa_encoder_server:app
    python_version: '3.11'
    python_dependencies:
      type: pip
      requirements_path: requirements.txt
ports:
  - host: vjepa2-vitl-dipo-ws-8000.slb-pilot.truefoundry.cloud
    port: 8000
    expose: true
    protocol: TCP
    app_protocol: http
workspace_fqn: tfy-slb-demo:dipo-ws
artifacts_download:
  artifacts:
    - type: truefoundry-artifact
      artifact_version_fqn: model:slb-pilot/slb-pov/vjepa2-vitl:1
      download_path_env_variable: MODEL_DIR
  cache_volume:
    cache_size: 200
    storage_class: efs-sc
replicas: 1
auto_shutdown:
  wait_time: 3600
readiness_probe:
  config:
    type: http
    path: /health
    port: 8000
  failure_threshold: 3
  initial_delay_seconds: 60
  period_seconds: 10
  success_threshold: 1
  timeout_seconds: 1
allow_interception: false
resources:
  node:
    type: node_selector
    capacity_type: spot_fallback_on_demand
  devices:
    - name: L4
      type: nvidia_gpu
      count: 1
  cpu_request: 4
  cpu_limit: 4
  memory_request: 13600
  memory_limit: 16000
  ephemeral_storage_request: 20000
  ephemeral_storage_limit: 100000
